<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6559d9"><meta name="description" content="VPS 产品库存状态与补货订阅"><title>VPS 库存监控</title><link rel="stylesheet" href="/style.css"><link rel="manifest" href="/manifest.json"></head>
<body><main><header><div><span class="eyebrow">VPS · STOCK MONITOR</span><h1 id="title">VPS 库存监控</h1><p id="description">正在加载产品数据…</p></div><button id="theme" class="theme" aria-label="切换深浅主题">☾</button></header><nav id="links" aria-label="网站导航"></nav>
<section class="hero"><div class="hero-top"><span class="live-dot"></span><strong>实时库存看板</strong><span id="runtime">等待同步状态</span><button id="refresh">立即刷新</button></div><div class="stats"><div><strong id="count">—</strong><span>监控产品</span></div><div><strong id="inStock">—</strong><span>当前有货</span></div><div><strong id="vendorCount">—</strong><span>商家分类</span></div><div><strong id="checks">—</strong><span>成功检查次数</span></div></div></section>
<p id="announcement" class="announcement" hidden></p>
<section class="subscriptions"><article><h2>🌐 浏览器补货通知</h2><p id="pushHint">关闭页面后也能接收补货提醒</p><button id="push">开启浏览器通知</button><p class="hint">iOS 用户需添加到主屏幕后打开，并允许通知。</p></article><article><h2>📧 邮件订阅通知</h2><p id="emailHint">验证邮箱后，接收全部产品补货动态</p><form id="emailForm"><label class="sr-only" for="email">邮箱地址</label><input type="email" id="email" maxlength="254" required placeholder="输入邮箱地址"><div class="actions"><button type="submit" id="subscribe">订阅</button><button type="button" id="unsubscribe" class="secondary">取消订阅</button></div></form></article><article><h2>💬 其他订阅渠道</h2><p>选择你习惯使用的平台</p><div id="channels" class="pills"></div><p class="hint">外部平台的订阅由对应平台管理。</p></article></section>
<section class="products"><div class="section-title"><h2>📦 产品状态</h2><div id="catalogLinks" class="pills"></div><input id="search" type="search" aria-label="搜索产品" placeholder="搜索产品、配置、线路…"></div><div id="tabs" class="tabs"></div><div class="table-wrap"><table><thead><tr><th>产品名称</th><th>配置 / 线路</th><th>库存状态</th><th>同步间隔</th><th>上次检查</th><th>购买链接</th><th>订阅渠道</th></tr></thead><tbody id="products"><tr><td colspan="7">正在加载…</td></tr></tbody></table></div><p id="updated" class="hint"></p></section><footer><p id="footer"></p><div id="footerLinks"></div><a href="/admin/">管理后台</a></footer></main><div id="toast" role="status" aria-live="polite"></div><dialog id="confirmation"><h2>确认邮箱操作</h2><p>请确认这是你本人发起的订阅或退订请求。</p><button id="confirmEmail">确认</button><button id="cancelEmail" class="secondary">取消</button></dialog><script src="/app.js" defer></script></body></html>
