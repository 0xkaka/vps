limit_req_zone $binary_remote_addr zone=vps_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=vps_public:10m rate=10r/s;
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 68.68.249.248;
    root /opt/vps/www;
    index index.html;
    client_max_body_size 16m;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json;
    location = /admin-api/system/auth/register { return 403; }
    location /admin/assets/ { expires 7d; try_files $uri =404; }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    location = /admin { return 302 /admin/; }
    location /admin/ { try_files $uri $uri/ /admin/index.html; }
    location = /admin-api/system/auth/login {
        limit_req zone=vps_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:48080;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /admin-api/ {
        proxy_pass http://127.0.0.1:48080;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 70s;
    }
    location /app-api/stock/ {
        limit_req zone=vps_public burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:48080;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /infra/ws { proxy_pass http://127.0.0.1:48080; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
}
